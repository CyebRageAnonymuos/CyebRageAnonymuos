<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C4B5FD" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .title-text { font-family: 'Courier New', monospace; font-weight: 700; letter-spacing: 5px; }
    .sub-text { font-family: 'Courier New', monospace; letter-spacing: 1.5px; }

    .scanline { animation: scan 4.5s linear infinite; }
    @keyframes scan {
      0%   { transform: translateY(-50px); }
      100% { transform: translateY(260px); }
    }

    .glitch-a { animation: glitchA 6s infinite; }
    .glitch-b { animation: glitchB 6s infinite; }
    @keyframes glitchA {
      0%, 91%, 100% { transform: translate(0,0); opacity: 0; }
      92%  { transform: translate(-4px,1px); opacity: 0.75; }
      94%  { transform: translate(3px,-1px); opacity: 0.55; }
      96%  { transform: translate(-2px,0); opacity: 0; }
    }
    @keyframes glitchB {
      0%, 91%, 100% { transform: translate(0,0); opacity: 0; }
      92%  { transform: translate(4px,-1px); opacity: 0.75; }
      94%  { transform: translate(-3px,1px); opacity: 0.55; }
      96%  { transform: translate(2px,0); opacity: 0; }
    }

    .subtitle { animation: fadeIn 1.8s ease-in 0.2s both; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

    .grid-line { animation: gridPulse 5s ease-in-out infinite; }
    @keyframes gridPulse { 0%, 100% { opacity: 0.04; } 50% { opacity: 0.10; } }
  </style>

  <rect width="1000" height="260" fill="url(#bgGrad)"/>

  <g stroke="#C4B5FD" class="grid-line">
    <line x1="0" y1="65" x2="1000" y2="65"/>
    <line x1="0" y1="130" x2="1000" y2="130"/>
    <line x1="0" y1="195" x2="1000" y2="195"/>
    <line x1="250" y1="0" x2="250" y2="260"/>
    <line x1="750" y1="0" x2="750" y2="260"/>
  </g>

  <rect class="scanline" x="0" y="-50" width="1000" height="50" fill="url(#scanGrad)"/>

  <text x="500" y="118" text-anchor="middle" class="title-text glitch-a" font-size="60" fill="#67e8f9">CYBER-RAGE</text>
  <text x="500" y="118" text-anchor="middle" class="title-text glitch-b" font-size="60" fill="#f472b6">CYBER-RAGE</text>
  <text x="500" y="118" text-anchor="middle" class="title-text" font-size="60" fill="#ffffff">CYBER-RAGE</text>

  <text x="500" y="160" text-anchor="middle" class="sub-text subtitle" font-size="16" fill="#C4B5FD">ANONYMOUS COLLECTIVE // SECURITY &#183; CODE &#183; INFRASTRUCTURE</text>

  <text x="365" y="205" text-anchor="start" class="sub-text" font-size="15" fill="#e5e5f0">$ identify --member</text>
  <rect class="cursor" x="540" y="192" width="9" height="16" fill="#C4B5FD"/>
</svg>
