<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C4B5FD" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text { font-family: 'Courier New', monospace; font-weight: 700; letter-spacing: 5px; }
    .sub-text { font-family: 'Courier New', monospace; letter-spacing: 1.5px; }

    .scanline { animation: scan 3.5s linear infinite; }
    @keyframes scan { 0% { transform: translateY(-50px);} 100% { transform: translateY(260px);} }
    .scanline2 { animation: scan2 1.7s linear infinite; }
    @keyframes scan2 { 0% { transform: translateY(-8px);} 100% { transform: translateY(260px);} }

    .glitch-a { animation: glitchA 4s infinite; }
    .glitch-b { animation: glitchB 4s infinite; }
    @keyframes glitchA {
      0%, 87%, 100% { transform: translate(0,0); opacity: 0; }
      88% { transform: translate(-6px,2px); opacity: 0.85; }
      90% { transform: translate(5px,-2px); opacity: 0.7; }
      92% { transform: translate(-4px,1px); opacity: 0.5; }
      94% { transform: translate(2px,0); opacity: 0; }
    }
    @keyframes glitchB {
      0%, 87%, 100% { transform: translate(0,0); opacity: 0; }
      88% { transform: translate(6px,-2px); opacity: 0.85; }
      90% { transform: translate(-5px,2px); opacity: 0.7; }
      92% { transform: translate(4px,-1px); opacity: 0.5; }
      94% { transform: translate(-2px,0); opacity: 0; }
    }
    .tear { animation: tearFlash 4s infinite; }
    @keyframes tearFlash {
      0%, 87%, 100% { opacity: 0; transform: translateX(0); }
      88% { opacity: 0.55; transform: translateX(-25px); }
      91% { opacity: 0.35; transform: translateX(20px); }
      94% { opacity: 0; transform: translateX(0); }
    }
    .flicker { animation: flick 4s infinite; }
    @keyframes flick {
      0%, 86%, 89%, 100% { opacity: 1; }
      87%, 88% { opacity: 0.3; }
    }

    .subtitle { animation: fadeIn 1.8s ease-in 0.2s both; }
    @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }

    .cursor-inline { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%,50% {opacity:1;} 50.01%,100% {opacity:0;} }

    .grid-line { animation: gridPulse 5s ease-in-out infinite; }
    @keyframes gridPulse { 0%,100% {opacity:0.06;} 50% {opacity:0.16;} }

    .corner { animation: cornerPulse 2.6s ease-in-out infinite; }
    @keyframes cornerPulse { 0%,100% {opacity:0.55;} 50% {opacity:1;} }

    .particle { animation: twinkle 3s ease-in-out infinite; }
    @keyframes twinkle { 0%,100% {opacity:0.15;} 50% {opacity:0.9;} }
  </style>

  <rect width="1000" height="260" fill="url(#bgGrad)"/>

  <g stroke="#C4B5FD" class="grid-line">
    <line x1="0" y1="65" x2="1000" y2="65"/>
    <line x1="0" y1="130" x2="1000" y2="130"/>
    <line x1="0" y1="195" x2="1000" y2="195"/>
    <line x1="250" y1="0" x2="250" y2="260"/>
    <line x1="750" y1="0" x2="750" y2="260"/>
  </g>

  <circle cx="0" cy="65" r="2.5" fill="#C4B5FD" filter="url(#glow)"><animateMotion dur="5s" repeatCount="indefinite" path="M0,0 L1000,0"/></circle>
  <circle cx="0" cy="130" r="2.5" fill="#67e8f9" filter="url(#glow)"><animateMotion dur="7s" repeatCount="indefinite" path="M0,0 L1000,0"/></circle>
  <circle cx="0" cy="195" r="2.5" fill="#f472b6" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite" path="M0,0 L1000,0"/></circle>

  <g class="particle" fill="#C4B5FD" style="animation-delay:0.2s">
    <circle cx="90" cy="35" r="1.6"/>
  </g>
  <g class="particle" fill="#67e8f9" style="animation-delay:1.1s">
    <circle cx="180" cy="225" r="1.4"/>
  </g>
  <g class="particle" fill="#f472b6" style="animation-delay:0.6s">
    <circle cx="900" cy="40" r="1.6"/>
  </g>
  <g class="particle" fill="#C4B5FD" style="animation-delay:1.8s">
    <circle cx="60" cy="150" r="1.3"/>
  </g>
  <g class="particle" fill="#67e8f9" style="animation-delay:0.9s">
    <circle cx="940" cy="230" r="1.5"/>
  </g>
  <g class="particle" fill="#C4B5FD" style="animation-delay:2.3s">
    <circle cx="320" cy="30" r="1.3"/>
  </g>
  <g class="particle" fill="#f472b6" style="animation-delay:1.4s">
    <circle cx="700" cy="235" r="1.4"/>
  </g>
  <g class="particle" fill="#67e8f9" style="animation-delay:0.4s">
    <circle cx="470" cy="245" r="1.3"/>
  </g>

  <g class="corner" stroke="#C4B5FD" stroke-width="2.2" fill="none" filter="url(#glow)">
    <path d="M15,42 L15,15 L42,15"/>
    <path d="M958,15 L985,15 L985,42"/>
    <path d="M15,218 L15,245 L42,245"/>
    <path d="M985,218 L985,245 L958,245"/>
  </g>

  <rect class="scanline" x="0" y="-50" width="1000" height="50" fill="url(#scanGrad)"/>
  <rect class="scanline2" x="0" y="-8" width="1000" height="2" fill="#C4B5FD" opacity="0.5"/>

  <rect class="tear" x="0" y="98" width="1000" height="5" fill="#67e8f9"/>
  <rect class="tear" x="0" y="140" width="1000" height="4" fill="#f472b6"/>

  <g class="flicker">
    <text x="500" y="118" text-anchor="middle" class="title-text glitch-a" font-size="60" fill="#67e8f9">CYBER-RAGE</text>
    <text x="500" y="118" text-anchor="middle" class="title-text glitch-b" font-size="60" fill="#f472b6">CYBER-RAGE</text>
    <text x="500" y="118" text-anchor="middle" class="title-text" font-size="60" fill="#ffffff" filter="url(#glow)">CYBER-RAGE</text>
  </g>

  <text x="500" y="160" text-anchor="middle" class="sub-text subtitle" font-size="16" fill="#C4B5FD">ANONYMOUS COLLECTIVE // SECURITY &#183; CODE &#183; INFRASTRUCTURE</text>

  <text x="365" y="205" text-anchor="start" class="sub-text" font-size="15" fill="#e5e5f0" filter="url(#glow)">$ identify --member<tspan class="cursor-inline" fill="#C4B5FD">&#9608;</tspan></text>
</svg>
